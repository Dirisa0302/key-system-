<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZincHub Key System</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #6366f1;
            --bg-overlay: rgba(15, 23, 42, 0.85);
        }

        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            /* Thay link ảnh ZincHub của bạn vào đây */
            background: url('https://i.postimg.cc/vTvdKzmg/zinchubpng-png.png') no-repeat center center fixed;
            background-size: cover;
        }

        .container {
            background: var(--bg-overlay);
            backdrop-filter: blur(10px);
            padding: 30px;
            border-radius: 15px;
            width: 90%;
            max-width: 450px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.1);
            color: white;
        }

        h2 {
            margin-top: 0;
            font-size: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .key-box {
            background: rgba(0, 0, 0, 0.3);
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
            word-break: break-all;
            font-family: 'Courier New', Courier, monospace;
            border: 1px dashed var(--primary-color);
            color: #cbd5e1;
            font-size: 14px;
        }

        /* Ô Status */
        .status-box {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 10px 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0.3px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: #cbd5e1;
            transition: 0.3s;
        }

        .status-box.status-ready { color: #94a3b8; }
        .status-box.status-redirecting { color: #facc15; border-color: rgba(250, 204, 21, 0.4); }
        .status-box.status-verifying { color: #facc15; border-color: rgba(250, 204, 21, 0.4); }
        .status-box.status-creating { color: #facc15; border-color: rgba(250, 204, 21, 0.4); }
        .status-box.status-created { color: #38bdf8; border-color: rgba(56, 189, 248, 0.4); }
        .status-box.status-activated { color: #4ade80; border-color: rgba(74, 222, 128, 0.4); }
        .status-box.status-expired { color: #f87171; border-color: rgba(248, 113, 113, 0.4); }
        .status-box.status-revoked { color: #fb7185; border-color: rgba(251, 113, 133, 0.5); }
        .status-box.status-error { color: #f87171; border-color: rgba(248, 113, 113, 0.4); }

        .btn-row {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn {
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            width: 100%;
            transition: 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-size: 14px;
        }

        .btn-create {
            background: #10b981;
        }
        .btn-create:hover:not(:disabled) {
            background: #059669;
            transform: translateY(-2px);
        }

        .btn-copy {
            background: var(--primary-color);
        }
        .btn-copy:hover:not(:disabled) {
            background: #4f46e5;
            transform: translateY(-2px);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }

        /* Bộ đếm ngược */
        .countdown {
            margin-top: 15px;
            font-size: 20px;
            font-weight: 700;
            font-family: 'Courier New', Courier, monospace;
            letter-spacing: 1px;
            color: #e2e8f0;
        }

        .expiry-info {
            margin-top: 8px;
            font-size: 12px;
            color: #94a3b8;
        }

        .footer-text {
            margin-top: 20px;
            font-size: 11px;
            opacity: 0.5;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .fa-spinner {
            animation: spin 0.8s linear infinite;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>🔑 ZincHub Key System</h2>

    <!-- Ô Status -->
    <div class="status-box status-ready" id="status-box">
        <i class="fas fa-circle-info" id="status-icon"></i>
        <span id="status-text">Ready</span>
    </div>

    <div class="key-box" id="key-display">
        Chưa có key. Nhấn "Create Key" để bắt đầu.
    </div>

    <div class="btn-row">
        <button class="btn btn-create" id="btn-create" onclick="startClaimFlow()">
            <i class="fas fa-key"></i> Create Key
        </button>

        <button class="btn btn-copy" id="btn-copy" onclick="copyKey()" disabled>
            <i class="fas fa-copy"></i> Copy Key
        </button>
    </div>

    <div class="countdown" id="countdown-display" style="display:none;">--:--:--</div>

    <div class="expiry-info" id="expiry-display"></div>

    <div class="footer-text">
        © zinchub - buihoangduy
    </div>
</div>

<script>
    // ===================================================================
    // FLOW: Create Key -> POST /claim/start -> redirect qua link4m
    //       -> user hoàn thành -> quay lại trang này với ?session=...
    //       -> tự động POST /claim (đổi session lấy token)
    //       -> tự động POST /create-key (đổi token lấy license key)
    // ===================================================================

    const urlParams = new URLSearchParams(window.location.search);
    const returningSession = urlParams.get('session');

    const keyDisplay = document.getElementById('key-display');
    const btnCreate = document.getElementById('btn-create');
    const btnCopy = document.getElementById('btn-copy');
    const statusBox = document.getElementById('status-box');
    const statusIcon = document.getElementById('status-icon');
    const statusText = document.getElementById('status-text');
    const countdownDisplay = document.getElementById('countdown-display');
    const expiryDisplay = document.getElementById('expiry-display');

    let countdownTimer = null;
    let infoPollTimer = null;
    let currentKey = null;
    let keyAlreadyCreated = false; // khoá nút Create Key sau khi thành công (chỉ hỗ trợ UI)

    function setStatus(state, customText) {
        statusBox.className = 'status-box status-' + state;

        const map = {
            ready:        { icon: 'fa-circle-info',          text: 'Ready' },
            redirecting:  { icon: 'fa-spinner fa-spin',       text: 'Redirecting to verification...' },
            verifying:    { icon: 'fa-spinner fa-spin',       text: 'Verifying...' },
            creating:     { icon: 'fa-spinner fa-spin',       text: 'Creating...' },
            created:      { icon: 'fa-circle-check',          text: 'Key Created' },
            activated:    { icon: 'fa-bolt',                  text: 'Activated' },
            expired:      { icon: 'fa-triangle-exclamation',  text: 'Expired' },
            revoked:      { icon: 'fa-ban',                   text: 'Revoked' },
            error:        { icon: 'fa-circle-exclamation',    text: 'Error' }
        };

        const cfg = map[state] || map.ready;
        statusIcon.className = 'fas ' + cfg.icon;
        statusText.innerText = customText || cfg.text;
    }

    // ---- Bước 1: User bấm "Create Key" -> xin session -> redirect qua link4m ----
    async function startClaimFlow() {
        btnCreate.disabled = true;
        setStatus('redirecting');
        keyDisplay.innerText = "Đang chuyển hướng để xác thực, vui lòng chờ...";

        try {
            const response = await fetch('/claim/start', { method: 'POST' });
            const data = await response.json();

            if (data.error || !data.redirect_url) {
                keyDisplay.innerText = "❌ " + (data.error || "Không thể khởi tạo phiên xác thực");
                setStatus('error');
                btnCreate.disabled = false;
                return;
            }

            // Điều hướng người dùng qua link4m. Sau khi hoàn thành, link4m sẽ
            // redirect user quay lại đúng trang này kèm ?session=...
            window.location.href = data.redirect_url;
        } catch (err) {
            keyDisplay.innerText = "❌ Connection Error";
            setStatus('error');
            btnCreate.disabled = false;
        }
    }

    // ---- Bước 2 + 3: User vừa quay lại từ link4m với ?session=... ----
    async function resumeAfterLink4m(sessionId) {
        btnCreate.disabled = true;
        btnCopy.disabled = true;
        setStatus('verifying');
        keyDisplay.innerText = "Đang xác minh yêu cầu, vui lòng chờ...";

        // Xoá param ?session khỏi URL để tránh gọi lại /claim khi user F5
        const cleanUrl = window.location.origin + window.location.pathname;
        window.history.replaceState({}, document.title, cleanUrl);

        try {
            // Bước 2: đổi session lấy one-time token
            const claimResp = await fetch('/claim', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ session_id: sessionId })
            });
            const claimData = await claimResp.json();

            if (claimData.error) {
                keyDisplay.innerText = "❌ " + claimData.error;
                setStatus('error');
                btnCreate.disabled = false; // cho phép thử lại (bấm Create Key -> đi lại từ đầu)
                return;
            }

            const token = claimData.token;

            // Bước 3: đổi token lấy license key (loại trial qua link4m)
            setStatus('creating');
            keyDisplay.innerText = "Đang tạo key, vui lòng chờ...";

            const createResp = await fetch('/create-key', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ token, type: 'trial' })
            });
            const createData = await createResp.json();

            if (createData.error) {
                keyDisplay.innerText = "❌ " + createData.error;
                setStatus('error');
                btnCreate.disabled = false;
                return;
            }

            keyDisplay.innerText = createData.key;
            currentKey = createData.key;
            setStatus('created');
            btnCopy.disabled = false;
            keyAlreadyCreated = true;

            // Nút Create Key vẫn bị vô hiệu hóa cho đến khi tải lại trang
            btnCreate.disabled = true;

            if (createData.type === 'lifetime' || !createData.expires_at) {
                countdownDisplay.style.display = 'none';
                expiryDisplay.innerHTML = `<i class="fas fa-infinity"></i> Lifetime - Never Expires`;
                setTimeout(() => setStatus('activated'), 300);
            } else {
                startCountdown(createData.expires_at);
            }

            startLicenseInfoPolling(currentKey);
        } catch (err) {
            keyDisplay.innerText = "❌ Connection Error";
            setStatus('error');
            btnCreate.disabled = false;
        }
    }

    function startCountdown(expiresAt) {
        const expiryDate = new Date(expiresAt);
        countdownDisplay.style.display = 'block';

        if (countdownTimer) clearInterval(countdownTimer);

        function tick() {
            const now = new Date();
            const diffMs = expiryDate - now;

            if (diffMs <= 0) {
                countdownDisplay.innerText = "00:00:00";
                expiryDisplay.innerHTML = `<i class="fas fa-hourglass-end"></i> Key đã hết hạn`;
                setStatus('expired');
                btnCopy.disabled = true;
                clearInterval(countdownTimer);
                return;
            }

            if (statusBox.className.indexOf('status-created') !== -1 ||
                statusBox.className.indexOf('status-ready') !== -1) {
                setStatus('activated');
            }

            const totalSeconds = Math.floor(diffMs / 1000);
            const hours = Math.floor(totalSeconds / 3600);
            const minutes = Math.floor((totalSeconds % 3600) / 60);
            const seconds = totalSeconds % 60;

            const pad = (n) => String(n).padStart(2, '0');
            countdownDisplay.innerText = `${pad(hours)}:${pad(minutes)}:${pad(seconds)}`;
            expiryDisplay.innerHTML = `<i class="fas fa-hourglass-half"></i> Thời gian còn lại`;
        }

        tick();
        countdownTimer = setInterval(tick, 1000);
    }

    // Hỏi server định kỳ qua GET /license-info để biết trạng thái THẬT
    // (ví dụ admin vừa revoke key -> website phải cập nhật, không thể chỉ tin countdown local)
    function startLicenseInfoPolling(licenseKey) {
        if (infoPollTimer) clearInterval(infoPollTimer);

        async function checkInfo() {
            try {
                const res = await fetch(`/license-info?key=${encodeURIComponent(licenseKey)}`);
                const info = await res.json();
                if (info.error) return;

                if (info.status === 'revoked') {
                    setStatus('revoked');
                    btnCopy.disabled = true;
                    countdownDisplay.style.display = 'none';
                    expiryDisplay.innerHTML = `<i class="fas fa-ban"></i> Key đã bị thu hồi`;
                    if (countdownTimer) clearInterval(countdownTimer);
                    clearInterval(infoPollTimer);
                } else if (info.status === 'expired') {
                    setStatus('expired');
                    btnCopy.disabled = true;
                    if (countdownTimer) clearInterval(countdownTimer);
                    clearInterval(infoPollTimer);
                }
            } catch (err) {
                // Bỏ qua lỗi mạng tạm thời, lần poll sau sẽ thử lại
            }
        }

        checkInfo();
        infoPollTimer = setInterval(checkInfo, 20000); // kiểm tra mỗi 20 giây
    }

    function copyKey() {
        const keyText = keyDisplay.innerText;
        if (!keyAlreadyCreated || keyText.includes("❌")) return;

        navigator.clipboard.writeText(keyText).then(() => {
            const originalHTML = btnCopy.innerHTML;
            btnCopy.innerHTML = '<i class="fas fa-check"></i> Copied!';
            setTimeout(() => {
                btnCopy.innerHTML = originalHTML;
            }, 2000);
        });
    }

    // ---- Khởi tạo khi trang load ----
    if (returningSession) {
        // User vừa được link4m redirect về -> tự động chạy bước /claim + /create-key
        resumeAfterLink4m(returningSession);
    } else {
        setStatus('ready');
    }
</script>

</body>
</html>
